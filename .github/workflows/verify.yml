name: Verify EOM Vercel deployment

on:
  push:
    branches:
      - main
      - vercel-supabase-serverless
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund
      - name: Validate Vercel deployment configuration
        run: node -e "JSON.parse(require('node:fs').readFileSync('vercel.json', 'utf8')); JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')); console.log('Deployment JSON is valid')"
      - name: Type-check
        run: npm run lint
      - name: Build Vite frontend
        run: npm run build
